<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganesh Prasad Bhandari | GenAI & Agentic AI Architect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root {
            --bg-main: #0a0f1d;
            --bg-card: #111827;
            --bg-terminal: #070a13;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .hero-container {
            position: relative;
            background: radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, rgba(10, 15, 29, 0) 70%);
            padding: 6rem 2rem 4rem 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .meta-text {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 800px;
            margin-bottom: 2rem;
        }

        .info-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .info-item i {
            color: var(--accent-cyan);
            font-size: 1.1rem;
        }

        .info-item a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .info-item a:hover {
            color: var(--accent-cyan);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin: 3rem 0;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple));
        }

        .metric-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        section {
            padding: 5rem 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: var(--border-color);
            margin-left: 1rem;
        }

        /* Video Showcase Area */
        .video-showcase {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .video-card h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .video-card h3 span {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent-purple);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .blueprint-container {
            background: var(--bg-terminal);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 12px;
            padding: 2rem;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .blueprint-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.r { background: #ef4444; }
        .dot.y { background: #f59e0b; }
        .dot.g { background: #10b981; }

        .layer-stack {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .layer-box {
            background: rgba(17, 24, 39, 0.8);
            border-left: 4px solid var(--accent-cyan);
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            border-radius: 0 8px 8px 0;
            transition: all 0.2s;
        }

        .layer-box:hover {
            border-left-color: var(--accent-purple);
            transform: translateX(5px);
            background: rgba(31, 41, 55, 0.4);
        }

        .layer-num {
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .layer-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0.25rem 0;
        }

        .layer-tech {
            font-size: 0.85rem;
            color: var(--accent-green);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(6, 182, 212, 0.4);
        }

        .card h3 {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h3 i {
            color: var(--accent-cyan);
        }

        .card ul {
            list-style: none;
        }

            position: relative;
            padding-left
